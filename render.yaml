# Render Blueprint — seules les vars Supabase sont obligatoires.
# Les autres variables reçoivent des valeurs par défaut auto-conçues par le serveur.
# Il suffit de définir SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY dans le dashboard Render.

services:
  - type: web
    name: dprinting
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://dprinting.onrender.com
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_BUCKET
        value: dprinting
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@dprinting.local
      - key: ADMIN_PASSWORD_HASH
        value: scrypt$16384$8$1$X+5395ez942RloH08PFH2Q==$EjCoyK+ythNmbN3TiNRZ8XY35lTQqdNr6HKNLOxPZv2j7enw8aOJ1e6aFDPVN7oSRG3IXoXsrsixGdgotr8Mgg==
      - key: DATABASE_URL
        value: postgresql://postgres.nlbtjysridayzbkrjukn:2eGiYsFIuC9N0wC6IEYHa64lbQf-FPAi@aws-0-eu-west-3.pooler.supabase.com:5432/postgres